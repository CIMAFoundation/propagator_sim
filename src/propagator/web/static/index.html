<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PROPAGATOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <h1>PROPAGATOR</h1>
    <span class="subtitle" data-i18n="app.subtitle">interactive fire simulation &mdash; local only</span>
    <div id="lang-switch">
      <button type="button" data-lang-btn="en">EN</button>
      <button type="button" data-lang-btn="it">IT</button>
    </div>
    <a class="manual-link" id="manual-link" href="manual.html" target="_blank" rel="noopener"
      data-i18n="manual.link" data-i18n-title="manual.link.title"
      title="Opens the user manual in a new tab">&#128214; Manual</a>
  </header>

  <div id="sidebar">
    <fieldset>
      <legend data-i18n="area.legend">Area</legend>
      <div class="pick-buttons">
        <button type="button" id="pick-center" class="active"
          data-i18n="area.pickCenter" data-i18n-title="area.pickCenter.title"
          title="Click on the map to set the center of the simulation area">1. Pick center</button>
        <button type="button" id="pick-ignition"
          data-i18n="area.pickIgnition" data-i18n-title="area.pickIgnition.title"
          title="Click on the map to set the fire ignition point (must be on vegetated land, not on a town or city)">2.
          Pick ignition</button>
      </div>
      <label><span data-i18n="area.radiusLabel">Radius</span> <span class="value" id="radius-value">10 km</span></label>
      <input type="range" id="radius" min="1" max="50" step="1" value="10"
        data-i18n-title="area.radius.title"
        title="Radius of the area around the chosen center, in km (max 50)">
      <label><span data-i18n="area.cellsizeLabel">Cellsize</span> <span class="value" id="cellsize-value">30 m</span></label>
      <input type="range" id="cellsize" min="20" max="100" step="5" value="30"
        data-i18n-title="area.cellsize.title"
        title="Size of the simulation grid cell, in meters: lower values give more detail but take longer to compute">
    </fieldset>

    <fieldset>
      <legend data-i18n="weather.legend">Weather</legend>
      <label><span data-i18n="weather.windDirLabel">Wind direction</span> <span class="value" id="wind-dir-value">0&deg;</span></label>
      <input type="range" id="wind-dir" min="0" max="359" step="1" value="0"
        data-i18n-title="weather.windDir.title"
        title="Direction the wind is blowing from, in degrees from north (0°=North, 90°=East, 180°=South, 270°=West)">
      <label><span data-i18n="weather.windSpeedLabel">Wind speed</span> <span class="value" id="wind-speed-value">20 km/h</span></label>
      <input type="range" id="wind-speed" min="0" max="80" step="1" value="20"
        data-i18n-title="weather.windSpeed.title" title="Wind speed, in km/h">
      <label><span data-i18n="weather.moistureLabel">Moisture</span> <span class="value" id="moisture-value">10%</span></label>
      <input type="range" id="moisture" min="0" max="100" step="1" value="10"
        data-i18n-title="weather.moisture.title"
        title="Fuel moisture, as a percentage: higher values slow down fire spread">
    </fieldset>

    <fieldset>
      <legend data-i18n="sim.legend">Simulation</legend>
      <label><span data-i18n="sim.durationLabel">Duration</span> <span class="value" id="duration-value">12 h</span></label>
      <input type="range" id="duration" min="1" max="48" step="1" value="12"
        data-i18n-title="sim.duration.title"
        title="Simulated duration of the fire, in hours">
      <label><span data-i18n="sim.resolutionLabel">Time resolution</span> <span class="value" id="resolution-value">1 h</span></label>
      <input type="range" id="resolution" min="0.5" max="6" step="0.5" value="1"
        data-i18n-title="sim.resolution.title"
        title="How often a results frame (map, statistics) is saved">
      <label><span data-i18n="sim.realizationsLabel">Realizations</span> <span class="value" id="realizations-value">10</span></label>
      <input type="range" id="realizations" min="1" max="50" step="1" value="10"
        data-i18n-title="sim.realizations.title"
        title="Number of independent stochastic simulations run: higher values give more reliable probability estimates but take longer">
      <label data-i18n-title="sim.spotting.title"
        title="If enabled, the model generates wind-carried embers that can start new spot fires ahead of the main front">
        <span data-i18n="sim.spottingLabel">Spotting (embers)</span>
        <input type="checkbox" id="do-spotting">
      </label>
      <label data-i18n-title="sim.isochrone.title" title="Probability thresholds (0-1, comma-separated) for which isochrones are drawn on the map">
        <span data-i18n="sim.isochroneLabel">Isochrone thresholds</span>
        <input type="text" id="isochrone-thresholds" value="0.5,0.75,0.9" size="12">
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="poi.sectionLegend">Points of interest</legend>
      <label data-i18n-title="sim.includePois.title"
        title="Fetch OpenStreetMap points of interest (hospitals, schools, fire/police stations, power infrastructure, major roads, buildings) in the area and report fire arrival at each">
        <span data-i18n="sim.includePoisLabel">Enabled</span>
        <input type="checkbox" id="include-pois" checked>
      </label>
      <div id="poi-options">
        <label data-i18n-title="sim.maxPois.title" title="Maximum number of POIs to fetch/report for the area (higher-priority categories and those closest to the center are kept first)">
          <span data-i18n="sim.maxPoisLabel">Max POIs</span>
          <input type="number" id="max-pois" min="1" max="5000" step="50" value="1000">
        </label>
        <div class="poi-categories" data-i18n-title="sim.poiCategories.title" title="Which POI categories to fetch/report">
          <label><input type="checkbox" data-poi-category="hospital" checked> <span data-i18n="poi.category.hospital">Hospitals</span></label>
          <label><input type="checkbox" data-poi-category="fire_station" checked> <span data-i18n="poi.category.fireStation">Fire stations</span></label>
          <label><input type="checkbox" data-poi-category="police" checked> <span data-i18n="poi.category.police">Police</span></label>
          <label><input type="checkbox" data-poi-category="school" checked> <span data-i18n="poi.category.school">Schools</span></label>
          <label><input type="checkbox" data-poi-category="emergency" checked> <span data-i18n="poi.category.emergency">Other emergency</span></label>
          <label><input type="checkbox" data-poi-category="road" checked> <span data-i18n="poi.category.road">Major roads</span></label>
          <label><input type="checkbox" data-poi-category="building" checked> <span data-i18n="poi.category.building">Buildings</span></label>
          <label><input type="checkbox" data-poi-category="power" checked> <span data-i18n="poi.category.power">Power infrastructure</span></label>
        </div>
      </div>
      <div class="poi-legend" data-i18n-title="poi.legend.title" title="Points of interest: color shows whether the fire front has reached them yet">
        <span class="poi-legend-item"><span class="poi-dot poi-dot-unreached"></span> <span data-i18n="poi.legend.notReached">not reached</span></span>
        <span class="poi-legend-item"><span class="poi-dot poi-dot-reached"></span> <span data-i18n="poi.legend.reached">reached</span></span>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="actions.legend">Firefighting actions</legend>
      <label><span data-i18n="actions.typeLabel">Type</span> <span class="value"></span></label>
      <select id="action-type"
        data-i18n-title="actions.type.title"
        title="Type of intervention (the added moisture stacks on top of the base value and decays over time, about -1%/minute): Canadair +25% on the line, +22% in the one-cell buffer; Waterline +27% on the line and buffer; Helicopter +22% on scattered points along the line, +20% in the buffer; Heavy vehicles: does not affect moisture, replaces the fuel with a non-flammable strip">
        <option value="canadair"
          data-i18n="actions.canadair" data-i18n-title="actions.canadair.title"
          title="Moisture +25% on the line, +22% in the one-cell buffer (stacks on top of the base value, then decays over time)">
          Canadair</option>
        <option value="helicopter"
          data-i18n="actions.helicopter" data-i18n-title="actions.helicopter.title"
          title="Moisture +22% on scattered points along the line, +20% in the one-cell buffer (stacks on top of the base value, then decays over time)">
          Helicopter</option>
        <option value="waterline_action"
          data-i18n="actions.waterline" data-i18n-title="actions.waterline.title"
          title="Moisture +27% along the whole line and the one-cell buffer (stacks on top of the base value, then decays over time)">
          Waterline</option>
        <option value="heavy_action"
          data-i18n="actions.heavy" data-i18n-title="actions.heavy.title"
          title="Does not affect moisture: permanently replaces the fuel along the line (and one-cell buffer) with a non-flammable strip">
          Heavy vehicles</option>
      </select>
      <label><span data-i18n="actions.actionTimeLabel">Action time</span> <span class="value" id="action-time-value">1 h</span></label>
      <input type="range" id="action-time" min="0" max="48" step="0.5" value="1"
        data-i18n-title="actions.actionTime.title"
        title="Hours from the start of the simulation at which the action is carried out">
      <div class="pick-buttons">
        <button type="button" id="draw-action-line"
          data-i18n="actions.drawLine" data-i18n-title="actions.drawLine.title"
          title="Click on the map to add points to the intervention line, then press Finish line">Draw line</button>
        <button type="button" id="finish-action-line" disabled
          data-i18n="actions.finishLine" data-i18n-title="actions.finishLine.title"
          title="Finishes the drawn line and adds the action to the list">Finish line</button>
      </div>
      <ul id="actions-list"></ul>
    </fieldset>

    <button type="button" id="run-button" disabled
      data-i18n="run.button" data-i18n-title="run.button.title"
      title="Start the simulation with the current settings">Run
      simulation</button>

    <div class="warning" id="warning-banner"></div>

    <div id="status-panel">
      <div id="status-text">Running&hellip;</div>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>

    <div id="result-panel">
      <label><span data-i18n="result.timeLabel">Time</span> <span class="value" id="frame-value">&mdash;</span></label>
      <input type="range" id="frame-slider" min="0" max="0" step="1" value="0"
        data-i18n-title="result.frameSlider.title"
        title="Scrub to see the fire map hour by hour, across the available results">
      <div class="stat-grid">
        <div class="stat" data-i18n-title="result.statAreaMean.title"
          title="Expected burned area: sum of each cell's fire probability × cell area (hectares)">
          <div class="stat-value" id="stat-area-mean">&mdash;</div>
          <div class="stat-label" data-i18n="result.statAreaMeanLabel">Mean area (ha)</div>
        </div>
        <div class="stat" data-i18n-title="result.statArea50.title"
          title="Area where the fire arrived in at least 50% of the simulated realizations (hectares)">
          <div class="stat-value" id="stat-area-50">&mdash;</div>
          <div class="stat-label" data-i18n="result.statArea50Label">Area prob&ge;50%</div>
        </div>
        <div class="stat" data-i18n-title="result.statNActive.title"
          title="Number of realizations, out of the total configured, whose fire front is still active at this instant">
          <div class="stat-value" id="stat-n-active">&mdash;</div>
          <div class="stat-label" data-i18n="result.statNActiveLabel">Active realizations</div>
        </div>
        <div class="stat" data-i18n-title="result.statFrameCount.title" title="Number of time instants (hourly frames) available for this simulation">
          <div class="stat-value" id="stat-frame-count">&mdash;</div>
          <div class="stat-label" data-i18n="result.statFrameCountLabel">Available frames</div>
        </div>
      </div>
      <svg id="chart" viewBox="0 0 320 140"
        data-i18n-title="result.chart.title"
        title="Burned area over time: solid line = expected mean area, dashed line = area with probability ≥50%"></svg>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>

</html>
