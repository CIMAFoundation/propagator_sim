<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>PROPAGATOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>PROPAGATOR</h1>
    <span class="subtitle">simulazione incendio interattiva &mdash; solo locale</span>
    <a class="manual-link" href="manual.html" target="_blank" rel="noopener" title="Apre il manuale utente in una nuova scheda">&#128214; Manuale</a>
  </header>

  <div id="sidebar">
    <fieldset>
      <legend>Area</legend>
      <div class="pick-buttons">
        <button type="button" id="pick-center" class="active" title="Clicca sulla mappa per impostare il centro dell'area di simulazione">1. Scegli centro</button>
        <button type="button" id="pick-ignition" title="Clicca sulla mappa per impostare il punto di innesco dell'incendio (deve trovarsi su area vegetata, non su un centro urbano)">2. Scegli innesco</button>
      </div>
      <label>Raggio <span class="value" id="radius-value">15 km</span></label>
      <input type="range" id="radius" min="1" max="50" step="1" value="15" title="Raggio dell'area attorno al centro scelto, in km (max 50)">
      <label>Cellsize <span class="value" id="cellsize-value">30 m</span></label>
      <input type="range" id="cellsize" min="20" max="100" step="5" value="30" title="Dimensione della cella della griglia di simulazione, in metri: valori più bassi danno più dettaglio ma richiedono più tempo di calcolo">
    </fieldset>

    <fieldset>
      <legend>Meteo</legend>
      <label>Direzione vento <span class="value" id="wind-dir-value">0&deg;</span></label>
      <input type="range" id="wind-dir" min="0" max="359" step="1" value="0" title="Direzione di provenienza del vento, in gradi rispetto al nord (0°=Nord, 90°=Est, 180°=Sud, 270°=Ovest)">
      <label>Velocit&agrave; vento <span class="value" id="wind-speed-value">20 km/h</span></label>
      <input type="range" id="wind-speed" min="0" max="80" step="1" value="20" title="Velocità del vento, in km/h">
      <label>Umidit&agrave; <span class="value" id="moisture-value">10%</span></label>
      <input type="range" id="moisture" min="0" max="100" step="1" value="10" title="Umidità del combustibile, in percentuale: valori più alti rallentano la propagazione del fuoco">
    </fieldset>

    <fieldset>
      <legend>Simulazione</legend>
      <label>Durata <span class="value" id="duration-value">6 h</span></label>
      <input type="range" id="duration" min="1" max="48" step="1" value="6" title="Durata simulata dell'incendio, in ore">
      <label>Risoluzione temporale <span class="value" id="resolution-value">1 h</span></label>
      <input type="range" id="resolution" min="0.5" max="6" step="0.5" value="1" title="Ogni quante ore viene salvato un frame dei risultati (mappa, statistiche)">
      <label>Realizzazioni <span class="value" id="realizations-value">10</span></label>
      <input type="range" id="realizations" min="1" max="50" step="1" value="10" title="Numero di simulazioni stocastiche indipendenti eseguite: valori più alti danno stime di probabilità più affidabili ma richiedono più tempo">
      <label title="Se attivo, il modello genera braci portate dal vento che possono far nascere nuovi focolai davanti al fronte principale">
        Spotting (braci)
        <input type="checkbox" id="do-spotting">
      </label>
      <label title="Soglie di probabilità (0-1, separate da virgola) per cui vengono tracciate le isocrone sulla mappa">
        Soglie isocrone
        <input type="text" id="isochrone-thresholds" value="0.5,0.75,0.9" size="12">
      </label>
    </fieldset>

    <fieldset>
      <legend>Azioni antincendio</legend>
      <label>Tipo <span class="value"></span></label>
      <select id="action-type" title="Tipo di intervento (l'umidità indicata si somma a quella di base e decade nel tempo, circa -1%/minuto): Canadair +25% sulla linea, +22% nel buffer di una cella; Waterline +27% su linea e buffer; Elicottero +22% su punti sparsi lungo la linea, +20% nel buffer; Mezzi pesanti: non tocca l'umidità, sostituisce il combustibile con una fascia non infiammabile">
        <option value="canadair" title="Umidità +25% sulla linea, +22% nel buffer di una cella (si somma a quella di base, poi decade nel tempo)">Canadair</option>
        <option value="helicopter" title="Umidità +22% su punti sparsi lungo la linea, +20% nel buffer di una cella (si somma a quella di base, poi decade nel tempo)">Elicottero</option>
        <option value="waterline_action" title="Umidità +27% su tutta la linea e il buffer di una cella (si somma a quella di base, poi decade nel tempo)">Waterline</option>
        <option value="heavy_action" title="Non tocca l'umidità: sostituisce il combustibile lungo la linea (e buffer di una cella) con una fascia non infiammabile, in modo permanente">Mezzi pesanti</option>
      </select>
      <label>Tempo azione <span class="value" id="action-time-value">1 h</span></label>
      <input type="range" id="action-time" min="0" max="48" step="0.5" value="1" title="Ore dall'inizio della simulazione in cui l'azione viene eseguita">
      <div class="pick-buttons">
        <button type="button" id="draw-action-line" title="Clicca sulla mappa per aggiungere i punti della linea d'intervento, poi premi Fine disegno">Disegna linea</button>
        <button type="button" id="finish-action-line" disabled title="Conclude la linea disegnata e aggiunge l'azione alla lista">Fine disegno</button>
      </div>
      <ul id="actions-list"></ul>
    </fieldset>

    <button type="button" id="run-button" disabled title="Avvia la simulazione con i parametri impostati">Avvia simulazione</button>

    <div class="warning" id="warning-banner"></div>

    <div id="status-panel">
      <div id="status-text">In corso&hellip;</div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="result-panel">
      <label>Ora <span class="value" id="frame-value">&mdash;</span></label>
      <input type="range" id="frame-slider" min="0" max="0" step="1" value="0" title="Scorri per vedere la mappa dell'incendio ora per ora, tra i risultati disponibili">
      <div class="stat-grid">
        <div class="stat" title="Area bruciata attesa: somma della probabilità di incendio di ogni cella × area cella (ettari)"><div class="stat-value" id="stat-area-mean">&mdash;</div><div class="stat-label">Area media (ha)</div></div>
        <div class="stat" title="Area in cui il fuoco è arrivato in almeno il 50% delle realizzazioni simulate (ettari)"><div class="stat-value" id="stat-area-50">&mdash;</div><div class="stat-label">Area prob&ge;50%</div></div>
        <div class="stat" title="Numero di realizzazioni, sul totale impostato, in cui il fronte del fuoco è ancora attivo in questo istante"><div class="stat-value" id="stat-n-active">&mdash;</div><div class="stat-label">Realizzazioni attive</div></div>
        <div class="stat" title="Numero di istanti temporali (frame orari) disponibili per questa simulazione"><div class="stat-value" id="stat-frame-count">&mdash;</div><div class="stat-label">Frame disponibili</div></div>
      </div>
      <svg id="chart" viewBox="0 0 320 140" title="Area bruciata nel tempo: linea piena = area media attesa, linea tratteggiata = area con probabilità ≥50%"></svg>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
