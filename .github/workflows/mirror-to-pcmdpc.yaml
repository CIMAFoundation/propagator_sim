name: Mirror main to pcm-dpc

on:
  push:
    branches:
      - push-to-pcm-dpc-test

jobs:
  mirror:
    name: Push to pcm-dpc/propagator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to downstream repository
        #env:
        # TARGET_REPO: pcm-dpc/propagator.git
        #PUSH_TOKEN: ${{ secrets.PROPAGATOR_PUSH_TO_PCMDPC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git remote add downstream "https://x-access-token:${{secrets.PROPAGATOR_PUSH_TO_PCMDPC_REPO_TOKEN}}@github.com/pcm-dpc/propagator.git"
          git push downstream HEAD:main --force-with-lease
          git push downstream --tags
